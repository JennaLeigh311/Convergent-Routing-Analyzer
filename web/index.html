<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Convergent Routing Analyzer — Live Congestion Map</title>
  </head>
  <body>
    <!--
      The React app (Vite entry) mounts into #root. The <h1> banner below is the
      pre-hydration / no-JS fallback: it keeps the document meaningful before the
      bundle loads and satisfies the CI lane-b well-formedness check (title + h1).
      React replaces #root's children on mount.
    -->
    <div id="root">
      <h1>Convergent Routing Analyzer</h1>
      <noscript>This live congestion map requires JavaScript.</noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
