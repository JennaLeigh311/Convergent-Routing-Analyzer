# nginx config for the production web image (docker-compose `core` profile).
#
# nginx serves the built React SPA AND reverse-proxies the engine surface so the
# browser only ever talks to its own origin — no hardcoded cross-origin engine URL
# baked into the bundle (the §R6 / issue-#100 "configurable engine base" point):
#
#   /api/*   -> engine REST root (the /api prefix is stripped).
#   /stream  -> engine WebSocket /stream (Upgrade headers forwarded).
#
# The engine host:port is the compose service name `engine:8080` by default, made
# overridable via the ENGINE_UPSTREAM env (templated into this file at container
# start by nginx's envsubst entrypoint — see the Dockerfile).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: serve index.html for any unknown path (client-side routing safe).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST proxy: /api/graph -> http://engine:8080/graph , etc.
    location /api/ {
        proxy_pass http://${ENGINE_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy for the live stream. Forward the Upgrade handshake and use a
    # long read timeout so a slow-draining stream isn't cut off mid-run.
    location /stream {
        proxy_pass http://${ENGINE_UPSTREAM}/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
