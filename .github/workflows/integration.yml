# Lane C — integration / e2e smoke (issue #7, project-spec.md §R7).
#
# Heavy: builds images and boots the `full` compose profile
# (engine + web + postgis + kafka + Spark pipeline, the pipeline image pins
# pyspark==3.5.1). Therefore NOT push/PR-triggered — it runs nightly on a cron
# and on-demand via workflow_dispatch (the gated/manual path). It is NOT a
# required check for merging to `main` (lanes A & B are).
#
# Versions are pinned in the images/go.mod, not here: Go 1.25 (engine go.mod),
# PySpark 3.5.1 (pipeline/Dockerfile). Node is deferred to Phase 10 (no web
# build step yet — see Lane B).
name: Lane C

on:
  schedule:
    # 07:00 UTC nightly (~midnight US Pacific). Cron has no seconds field.
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: lane-c-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: full-profile e2e smoke
    runs-on: ubuntu-latest
    # Generous cap: image builds + Kafka/PostGIS startup can be slow on shared
    # runners. The smoke itself polls for ~60s.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show docker compose version
        run: docker compose version

      # `make integration` boots the full profile, polls engine /healthz +
      # /readyz and web /, then tears the stack down (down -v) even on failure,
      # and exits non-zero if the smoke didn't pass. Reused verbatim so the CI
      # path and the local path can't drift.
      - name: make integration (boot full, smoke, tear down)
        run: make integration

      # Defensive: if the runner is cancelled/killed mid-`make`, the teardown
      # inside the recipe may not run. Always attempt a final cleanup.
      - name: Ensure teardown
        if: always()
        run: docker compose --profile full down -v --remove-orphans || true
