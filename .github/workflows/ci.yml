# CI — fast merge gates (issue #7, project-spec.md §R7).
#
# Two Docker-free lanes run on every push + PR, plus a single aggregate gate.
# Branch protection on `main` requires ONLY the `CI passed` check, which succeeds
# iff BOTH lanes succeed — so lanes can be renamed/split/added without touching
# the branch-protection rule (the required-check contract is one stable job name,
# not each lane's name). See scripts/protect-main.sh.
#
#   Lane A — Go engine: gofmt + vet + golangci-lint + govulncheck + race-enabled tests + the toy-graph bench.
#   Lane B — web: validate the Phase-0 static placeholder (index.html + Dockerfile).
#            web/ has no package.json/React yet (Phase 10); this expands to a real
#            node build + lint (setup-node -> npm ci -> lint -> build, + hadolint)
#            when the React app lands.
#
# Heavy integration (the full compose profile) is Lane C in integration.yml —
# nightly/gated, NOT a merge gate.
name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lane-a:
    name: Lane A
    runs-on: ubuntu-latest
    defaults:
      run:
        # The Go module lives under engine/, not the repo root.
        working-directory: engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Pinned to the engine's go.mod toolchain (go 1.26.4).
          go-version: "1.26.4"
          # Cache keys off go.sum so the module cache invalidates when a
          # dependency version (not just go.mod) changes.
          cache-dependency-path: engine/go.sum

      - name: gofmt (must report no files)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt: clean"

      - name: go vet
        run: go vet ./...

      - name: golangci-lint (pinned; a lint violation FAILS the merge gate)
        # The lint gate (issue #32). Previously the engine had no installed
        # linter in CI, so once Phase 1 added a dependency, "lint" silently
        # degraded to gofmt+vet. This step installs golangci-lint at a PINNED,
        # fixed version and FAILS the build on any violation — no optional-skip
        # path. The enabled linter SET is pinned separately in
        # engine/.golangci.yml so the gate is reproducible across upgrades; this
        # step pins the BINARY. Keep `version:` in sync with that file's header
        # and the repo Makefile's GOLANGCI_LINT_VERSION.
        #
        # v2.12.2 is built with go1.26.2, so it parses the engine's go-1.26.4
        # source tree. The official action reuses the Go set up above
        # (actions/setup-go is a hard prerequisite for v4.0.0+) and caches the
        # linter + analysis results. NOTE: this is a `uses:` step, so the job's
        # `defaults.run.working-directory: engine` does NOT apply — the module
        # dir is passed explicitly via `working-directory` below.
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: v2.12.2
          working-directory: engine

      - name: govulncheck (dependency + stdlib vulnerability scan)
        # The engine now has external dependencies (prometheus/client_golang +
        # transitive closure), so scan the reachable module + stdlib graph against
        # the Go vulnerability DB — a known-vulnerable, *actually-called* dependency
        # then fails the merge gate. govulncheck reports only vulns on reachable
        # paths, so it won't flag an unused transitive package. Uses the binary's
        # latest release (the vuln DB is fetched fresh regardless of binary
        # version); #32 may pin it alongside golangci-lint.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: go test (race detector — the engine is a concurrent server)
        # Also the frozen-fixture conformance gate: runs the segment_id (§1) and
        # edge_attributes (§2) golden-fixture tests, so a drifted fixture fails CI.
        run: go test -race ./...

      - name: route CLI smoke (asserts the canonical toy-graph route + cost)
        # Run the real route binary on the toy fixture with its default flags and
        # assert its output EXACTLY matches the golden — the single source of truth
        # for the canonical route (cmd/route/main_test.go asserts the same file), so
        # an A->B routing or free-flow cost regression fails the build, not just unit
        # tests. Then assert the negative path: a malformed coordinate exits non-zero
        # with a clear message. Build once and invoke the binary twice (no recompile).
        run: |
          bin="$(mktemp)"
          go build -o "$bin" ./cmd/route
          if ! "$bin" | diff -u testdata/canonical_route.golden -; then
            echo "route CLI output drifted from testdata/canonical_route.golden"
            exit 1
          fi
          echo "route CLI: canonical toy route + cost OK"
          # Negative path: a malformed -from must exit non-zero and name the bad flag.
          if err="$("$bin" -from foo -to 1,1 2>&1)"; then
            echo "route CLI: expected non-zero exit on malformed -from, got success"
            exit 1
          fi
          case "$err" in
            *'route: invalid -from "foo"'*) echo "route CLI: malformed-coord error OK" ;;
            *) echo "route CLI: unexpected error message: $err"; exit 1 ;;
          esac

      - name: bench (naive router over the toy graph; real run, not the six-algorithm harness)
        # Real but minimal: loads the toy network, runs the naive free-flow router,
        # and exits non-zero on any load/routing failure. We also assert the summary
        # reports requests_routed=2, so the step gates that routing actually produced
        # the expected batch — not merely that the process didn't crash. The full
        # convergent-routing comparison lands in a later phase.
        run: |
          out="$(go run ./cmd/benchmark 2>&1)"
          printf '%s\n' "$out"
          case "$out" in
            *requests_routed=2*) echo "bench: routed the expected batch OK" ;;
            *) echo "bench: did not route the expected batch (want requests_routed=2)"; exit 1 ;;
          esac

  lane-b:
    name: Lane B
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: index.html exists and is well-formed
        run: |
          test -f web/index.html || { echo "web/index.html missing"; exit 1; }
          # Well-formedness via Python's HTML parser (stdlib, no install). It
          # raises on malformed/unbalanced markup; we also assert a <title> and
          # the <h1> banner are present so an empty file can't pass.
          python3 - <<'PY'
          import sys
          from html.parser import HTMLParser

          class Checker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.stack = []
                  self.saw_title = False
                  self.saw_h1 = False
              # void elements that never need a closing tag
              VOID = {"area","base","br","col","embed","hr","img","input",
                      "link","meta","param","source","track","wbr"}
              def handle_starttag(self, tag, attrs):
                  if tag not in self.VOID:
                      self.stack.append(tag)
                  if tag == "title": self.saw_title = True
                  if tag == "h1": self.saw_h1 = True
              def handle_endtag(self, tag):
                  if tag in self.VOID:
                      return
                  if tag in self.stack:
                      # pop back to the matching open tag (tolerate optional
                      # end tags like </p> being implied)
                      while self.stack and self.stack.pop() != tag:
                          pass

          html = open("web/index.html", encoding="utf-8").read()
          c = Checker()
          c.feed(html)
          c.close()
          errs = []
          if c.stack:
              errs.append(f"unclosed tags: {c.stack}")
          if not c.saw_title:
              errs.append("missing <title>")
          if not c.saw_h1:
              errs.append("missing <h1>")
          if errs:
              print("web/index.html validation failed:")
              for e in errs: print("  -", e)
              sys.exit(1)
          print("web/index.html: well-formed (title + h1 present)")
          PY

      - name: Dockerfile sanity check
        run: |
          test -f web/Dockerfile || { echo "web/Dockerfile missing"; exit 1; }
          # Pinned base image (no floating :latest) and it must COPY the page in.
          grep -Eq '^FROM .+:[^ ]+' web/Dockerfile \
            || { echo "web/Dockerfile FROM is not pinned to a tag"; exit 1; }
          grep -q 'index.html' web/Dockerfile \
            || { echo "web/Dockerfile does not COPY index.html"; exit 1; }
          if grep -Eq '^FROM .+:latest' web/Dockerfile; then
            echo "web/Dockerfile pins a floating :latest tag"; exit 1
          fi
          echo "web/Dockerfile: pinned base + copies index.html"

  ci-passed:
    # The single required status check for branch protection. Runs after both
    # lanes regardless of their result (if: always()) and fails unless BOTH
    # succeeded. Requiring just this one stable context ("CI passed") means
    # renaming/splitting a lane never silently breaks the `main` protection rule.
    name: CI passed
    runs-on: ubuntu-latest
    needs: [lane-a, lane-b]
    if: always()
    steps:
      - name: Require all lanes to have succeeded
        run: |
          echo "lane-a=${{ needs.lane-a.result }} lane-b=${{ needs.lane-b.result }}"
          if [ "${{ needs.lane-a.result }}" != "success" ] || [ "${{ needs.lane-b.result }}" != "success" ]; then
            echo "::error::a required CI lane did not succeed"
            exit 1
          fi
          echo "all required lanes passed"
